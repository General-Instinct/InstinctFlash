[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lingbot-vla-iwm"
version = "0.1.0"
description = "LingBot-VLA (4B) Runtime adapter for InstinctFlash"
requires-python = ">=3.10"
dependencies = ["instinctflash"]

[project.entry-points."instinctflash.adapters"]
lingbot_vla = "lingbot_vla_iwm.adapter:LingBotVLA4BAdapter"

[tool.setuptools.packages.find]
include = ["lingbot_vla_iwm*"]
