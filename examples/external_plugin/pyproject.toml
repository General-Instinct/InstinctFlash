[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gridworld-wm"
version = "0.1.0"
description = "A toy autoregressive world-action model for InstinctFlash"
requires-python = ">=3.10"
dependencies = ["instinctflash", "torch", "safetensors", "numpy"]

# THE WHOLE INTEGRATION. `pip install gridworld-wm` and InstinctFlash can serve any checkpoint whose
# declaration says `backbone: gridworld_ar` -- no PR to InstinctFlash, no import order to remember.
[project.entry-points."instinctflash.adapters"]
gridworld_ar = "gridworld_wm.adapter:GridworldAdapter"

[tool.setuptools.packages.find]
include = ["gridworld_wm*"]
