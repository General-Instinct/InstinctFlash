[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pi05-iwm"
version = "0.1.0"
license = { text = "AGPL-3.0-or-later" }
description = "LeRobot pi05 VLA for InstinctFlash"
requires-python = ">=3.10"
dependencies = ["instinctflash"]

[project.entry-points."instinctflash.adapters"]
pi05 = "pi05_iwm.adapter:Pi05Adapter"

[project.entry-points."instinctflash.passes"]
pi05 = "pi05_iwm.passes:default_passes"

[tool.setuptools.packages.find]
include = ["pi05_iwm*"]

[tool.setuptools.data-files]
"share/instinctflash/pi05" = [
    "sm120_fp8_results.json",
    "sm120_libero_screen_results.json",
    "sm120_checkpoint_reference_results.json",
    "sm120_libero_matched_results.json",
    "sm120_task5_diagnostic_results.json",
    "sm120_frozen_results.json",
    "sm120_fusion_results.json",
    "verify_sm120_fp8.py",
    "reproduce_sm120_libero.py",
    "verify_checkpoint_reference.py",
    "requirements-sm120.lock",
]
