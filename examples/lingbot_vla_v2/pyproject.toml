[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lingbot-vla-v2-iwm"
version = "0.1.0"
description = "LingBot-VLA-V2 Runtime adapter for InstinctFlash"
requires-python = ">=3.10"
dependencies = ["instinctflash"]

[project.entry-points."instinctflash.adapters"]
lingbot_vla_v2 = "lingbot_vla_v2_iwm.adapter:LingBotVLAV2Adapter"

[tool.setuptools.packages.find]
include = ["lingbot_vla_v2_iwm*"]
